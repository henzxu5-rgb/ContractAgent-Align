name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r contract_agent/requirements-local.txt
      - run: python -m unittest discover -s contract_agent/tests -q
      - run: python tools/verify_public_results.py
